<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Grace Connect — Maintenance</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf7f2;
        color: #1a202c;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(129, 0, 8, 0.12), transparent),
          #faf7f2;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        border-radius: 1.5rem;
        border: 1px solid #e5d5c5;
        background: #fff;
        box-shadow: 0 8px 30px rgba(47, 60, 94, 0.1);
        padding: 1.75rem 1.5rem;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbe8e8;
        color: #810008;
      }
      .icon svg {
        width: 2rem;
        height: 2rem;
      }
      .brand {
        margin: 0 0 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8b2323;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #5b6470;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 9999px;
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: linear-gradient(90deg, #810008, #a3161e);
        color: #fff;
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .status {
        margin-top: 0.9rem;
        font-size: 0.75rem;
        color: #8a94a3;
        min-height: 1rem;
      }
      .pulse {
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin-right: 0.4rem;
        border-radius: 9999px;
        background: #f5a623;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <div class="card" role="dialog" aria-labelledby="title">
      <div class="icon" aria-hidden="true">
        <svg id="iconMaintenance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
        <svg id="iconOffline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M2 8.82A15 15 0 0 1 12 5c3.1 0 6 .9 8.4 2.4" />
          <path d="M5.5 12.5A10 10 0 0 1 12 10c1.9 0 3.7.5 5.2 1.4" />
          <path d="M9 16a5 5 0 0 1 6 0" />
          <line x1="2" y1="2" x2="22" y2="22" />
          <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <p class="brand">Grace Connect</p>
      <h1 id="title">We're updating the app</h1>
      <p id="message">
        Grace Connect is under maintenance right now. Try again after sometime.
      </p>
      <div class="actions">
        <button type="button" class="primary" id="retryBtn">Try again</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <script>
      (function () {
        var APP_ORIGIN = "https://graceconnect.graceahmedabad.org";
        var PROBE_PATH = "/logo.svg";

        var retryBtn = document.getElementById("retryBtn");
        var statusEl = document.getElementById("status");
        var titleEl = document.getElementById("title");
        var messageEl = document.getElementById("message");
        var iconMaintenance = document.getElementById("iconMaintenance");
        var iconOffline = document.getElementById("iconOffline");
        var navigating = false;
        var probing = false;

        function targetUrl() {
          var injected = window.__GRACE_RETRY_URL && String(window.__GRACE_RETRY_URL);
          if (injected && injected.indexOf(APP_ORIGIN) === 0) return injected;
          return APP_ORIGIN + "/";
        }

        function setStatus(html) {
          statusEl.innerHTML = html || "";
        }

        function failReason() {
          try {
            var params = new URLSearchParams(window.location.search || "");
            var q = params.get("reason");
            if (q === "offline" || q === "maintenance") return q;
          } catch (e) {}
          if (window.__GRACE_FAIL_REASON === "offline" || window.__GRACE_FAIL_REASON === "maintenance") {
            return window.__GRACE_FAIL_REASON;
          }
          return navigator.onLine === false ? "offline" : "maintenance";
        }

        function renderMode() {
          var offline = failReason() === "offline" || navigator.onLine === false;
          iconMaintenance.style.display = offline ? "none" : "";
          iconOffline.style.display = offline ? "" : "none";
          if (offline) {
            titleEl.textContent = "Connect to the internet";
            messageEl.textContent =
              "You're offline. Turn on Wi-Fi or mobile data, then tap Try again.";
            retryBtn.textContent = "Try again";
          } else {
            titleEl.textContent = "We're updating the app";
            messageEl.textContent =
              "Grace Connect is under maintenance right now. Try again after sometime.";
            retryBtn.textContent = "Try again";
          }
        }

        function openApp() {
          if (navigating) return;
          navigating = true;
          retryBtn.disabled = true;
          setStatus("Opening Grace Connect…");
          try {
            window.location.replace(targetUrl());
          } catch (e) {
            navigating = false;
            retryBtn.disabled = false;
          }
        }

        // A cross-origin <img> only fires onload for a 2xx response, so this
        // tells us the site is back without needing CORS on the server.
        function probe(manual) {
          if (probing || navigating) return;
          probing = true;
          if (manual) {
            retryBtn.disabled = true;
            setStatus("Checking…");
          }
          var img = new Image();
          var done = false;
          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            img.src = "";
            finish(false, manual);
          }, 8000);
          img.onload = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            finish(true, manual);
          };
          img.onerror = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            finish(false, manual);
          };
          img.src = APP_ORIGIN + PROBE_PATH + "?t=" + Date.now();
        }

        function finish(ok, manual) {
          probing = false;
          if (ok) {
            openApp();
            return;
          }
          retryBtn.disabled = false;
          renderMode();
          if (manual) {
            setStatus(
              failReason() === "offline" || navigator.onLine === false
                ? "Still offline. Turn on Wi-Fi or mobile data."
                : "Still updating. Try again after sometime."
            );
          }
        }

        retryBtn.addEventListener("click", function () {
          probe(true);
        });
        window.addEventListener("online", function () {
          renderMode();
          probe(false);
        });
        window.addEventListener("offline", renderMode);

        renderMode();
      })();
    </script>
  </body>
</html>
